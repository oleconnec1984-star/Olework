<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>จังไรออนไลน์ — Stage 1 Character Build</title>
<style>
:root{--ui:rgba(10,12,18,.78);--line:rgba(255,255,255,.22);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07090d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;background:#07090d}
#game{display:block;width:100vw;height:auto;max-height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;background:#151827}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none;z-index:20}
.group{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:66px;height:66px;border-radius:20px;border:2px solid var(--line);background:var(--ui);color:#fff;font-size:25px;font-weight:900;box-shadow:0 4px 16px #0008;touch-action:none;user-select:none}
.ctrl.action{font-size:13px;line-height:1.05}
.ctrl.on,.ctrl:active{transform:scale(.94);background:rgba(255,255,255,.22)}
#topbar{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:25;display:flex;gap:7px}
#topbar button{height:38px;border-radius:12px;border:1px solid var(--line);background:#0c0f16dd;color:#fff;font-weight:800;padding:0 12px}
#select{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#301548,#090b12 65%);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.panel{width:min(920px,96vw);border:2px solid #ffffff2e;border-radius:22px;background:#0d1018ee;box-shadow:0 24px 80px #000;padding:18px}
.logo{font-size:clamp(28px,6vw,62px);font-weight:1000;letter-spacing:-2px;text-align:center;background:linear-gradient(#ffd227,#ff6d00,#ff2365);-webkit-background-clip:text;color:transparent;text-shadow:0 5px 22px #ff54004a}
.sub{text-align:center;opacity:.78;margin-top:-4px;margin-bottom:14px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{border:2px solid #ffffff20;border-radius:16px;background:#141926;padding:8px;cursor:pointer;text-align:center;min-width:0}
.card.selected{border-color:#ffd43b;box-shadow:0 0 0 2px #ffd43b22,0 0 24px #ffd43b35}
.card canvas{width:100%;max-width:130px;aspect-ratio:1;image-rendering:pixelated}
.card b{display:block;font-size:16px}
.card small{opacity:.63}
#start{margin:16px auto 0;display:block;border:0;border-radius:15px;background:linear-gradient(180deg,#ffd43b,#ff8c00);color:#15100a;font-weight:1000;font-size:20px;padding:13px 34px;box-shadow:0 8px 28px #ff970044}
.note{text-align:center;opacity:.62;font-size:12px;margin-top:8px}
#rotate{display:none;position:fixed;inset:0;z-index:90;background:#080a10eF;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:800;padding:28px}
@media(max-width:720px) and (orientation:portrait){#rotate{display:flex}}
@media(min-width:900px){#controls{opacity:.62}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="topbar"><button id="restart">RESTART</button></div>
<div id="controls">
 <div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button><button class="ctrl" id="jump">▲</button></div>
 <div class="group"><button class="ctrl action" id="shoot">ยิง<br>J</button><button class="ctrl action" id="melee">ตี<br>K</button></div>
</div>
<div id="select">
 <div class="panel">
  <div class="logo">จังไรออนไลน์</div>
  <div class="sub">STAGE 1 • เลือกตัวละคร</div>
  <div class="cards">
   <div class="card selected" data-char="phee"><canvas width="128" height="128"></canvas><b>พี่ขอ</b><small>ของทิ้งคือกระสุน</small></div>
   <div class="card" data-char="soja"><canvas width="128" height="128"></canvas><b>ซ้อจ๋า</b><small>ซ้อเคลียร์ให้</small></div>
   <div class="card" data-char="em"><canvas width="128" height="128"></canvas><b>เอ็มตัวลาย</b><small>สายบวกเต็มระบบ</small></div>
   <div class="card" data-char="wairoon"><canvas width="128" height="128"></canvas><b>วัยรุ่นตัวลาย</b><small>ไวจัด • ฟาดไว</small></div>
  </div>
  <button id="start">START GAME</button>
  <div class="note">หมุนมือถือแนวนอน • เดิน / กระโดด / ยิง / ตี</div>
 </div>
</div>
<div id="rotate">📱↔️<br><br>หมุนมือถือเป็นแนวนอนก่อน<br>เกมจะได้เต็มจอแบบคนไม่ทรมานสายตา 😂</div>

function resetWorld(){
 player={kind:chosen,x:150,y:FLOOR-86,w:52,h:78,vx:0,vy:0,hp:180,maxHp:180,face:1,onGround:true,state:'idle',stateT:0,animT:0,inv:0,dead:false};

 ];

function mkEnemy(x){return {kind:'enemy',x,y:FLOOR-82,w:54,h:76,vx:0,vy:0,hp:90,maxHp:90,face:-1,onGround:true,state:'idle',stateT:0,animT:0,inv:0,dead:false,attackCd:0}}
function frames(obj,act){return MAP[obj.kind]?.[act]||MAP[obj.kind]?.idle||[]}
function setState(o,s,d=0){if(o.state!==s){o.state=s;o.animT=0}; if(d)o.stateT=Math.max(o.stateT,d)}
function frameOf(o){
 let a=frames(o,o.state); if(!a.length)a=frames(o,'idle');
 let fps=(o.state==='run'?11:o.state==='idle'?5:12);
 let idx=Math.floor(o.animT*fps);
 if(['death','hit','shoot','melee','attack'].includes(o.state)) idx=Math.min(a.length-1,idx);
 else idx%=a.length;
 return a[idx]||a[0];
}
function drawSprite(o,scale=1.8){
 const f=frameOf(o); if(!f)return;
 const dw=64*scale,dh=64*scale; let dx=o.x-cam+(o.w-dw)/2,dy=o.y+o.h-dh+7;
 X.save();
 if(o.face<0){X.translate(dx+dw,0);X.scale(-1,1);dx=0;}
 X.globalAlpha=o.inv>0&&Math.floor(o.inv*18)%2?0.35:1;
 X.drawImage(ATLAS,f[0],f[1],f[2],f[3],dx,dy,dw,dh);
 X.restore();
}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function damageEnemy(e,d,kb=0){
 if(e.dead||e.inv>0)return; e.hp=Math.max(0,e.hp-d);e.inv=.15;e.vx=kb;
 setState(e,'hit',.18); fx.push({x:e.x+e.w/2,y:e.y+20,t:.22,type:'hit'});
 if(e.hp<=0){e.dead=true;setState(e,'death',999);e.animT=0;kills++;coins+=25;}
}
function damagePlayer(d,dir){
 if(player.dead||player.inv>0)return;player.hp=Math.max(0,player.hp-d);player.inv=.75;player.vx=dir*250;player.vy=-210;
 setState(player,'hit',.22); if(player.hp<=0){player.dead=true;setState(player,'death',999);player.animT=0;}
}
function shoot(){
 if(!started||player.dead||player.stateT>0)return;setState(player,'shoot',.25);
 bullets.push({x:player.x+player.w/2+player.face*35,y:player.y+32,vx:player.face*650,w:18,h:7,t:1.5});
 fx.push({x:player.x+player.w/2+player.face*40,y:player.y+34,t:.08,type:'muzzle',face:player.face});
}
function melee(){
 if(!started||player.dead||player.stateT>0)return;setState(player,'melee',.36);
 const box={x:player.face>0?player.x+player.w-5:player.x-70,y:player.y+5,w:75,h:72};
 setTimeout(()=>{for(const e of enemies)if(!e.dead&&rect(box,e))damageEnemy(e,36,player.face*180)},110);
}
function update(dt){
 if(!started)return;
 const objs=[player,...enemies]; for(const o of objs){o.animT+=dt;o.inv=Math.max(0,o.inv-dt);o.stateT=Math.max(0,o.stateT-dt);}
 if(!player.dead){
   const L=key.ArrowLeft||key.KeyA||touch.left,R=key.ArrowRight||key.KeyD||touch.right;
   if(player.stateT<=0){
    if(L&&!R){player.vx=-250;player.face=-1;setState(player,'run')} else if(R&&!L){player.vx=250;player.face=1;setState(player,'run')} else {player.vx*=.68;setState(player,'idle')}
   }
   if((touch.jump||key.jumpPulse)&&player.onGround){player.vy=-520;player.onGround=false;setState(player,'jump')} touch.jump=false;key.jumpPulse=false;
   if(touch.shoot||key.shootPulse)shoot(); touch.shoot=false;key.shootPulse=false;
   if(touch.melee||key.meleePulse)melee(); touch.melee=false;key.meleePulse=false;
   player.vy+=1120*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(0,Math.min(WORLD-player.w,player.x));
   if(player.y+player.h>=FLOOR){player.y=FLOOR-player.h;player.vy=0;player.onGround=true;if(player.state==='jump')setState(player,'idle')} else player.onGround=false;
 }
 for(const e of enemies){
   if(e.dead)continue; e.attackCd=Math.max(0,e.attackCd-dt);
   const dx=player.x-e.x,dist=Math.abs(dx);e.face=dx<0?-1:1;
   if(!player.dead){
    if(e.stateT<=0){
      if(dist>66&&dist<520){e.vx=Math.sign(dx)*95;setState(e,'run')} else if(dist<=66&&e.attackCd<=0){e.vx=0;e.attackCd=.9;setState(e,'attack',.42);setTimeout(()=>{if(!player.dead&&Math.abs(player.x-e.x)<78)damagePlayer(14,Math.sign(player.x-e.x)||1)},180)} else {e.vx*=.7;setState(e,'idle')}
    }
   } else e.vx=0;
   e.x+=e.vx*dt;
 }
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.x+=b.vx*dt;b.t-=dt;let gone=b.t<=0||b.x<0||b.x>WORLD;
  if(!gone)for(const e of enemies)if(!e.dead&&rect(b,e)){damageEnemy(e,24,Math.sign(b.vx)*130);gone=true;break}
  if(gone)bullets.splice(i,1);
 }
 for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1)}
 cam+=(Math.max(0,Math.min(WORLD-W,player.x-W*.38))-cam)*Math.min(1,dt*6);
}
function drawLayer(img, speed, y, h, tileW, alpha=1){
 if(!img.complete||!img.naturalWidth)return;
 const off=-((cam*speed)%tileW);
 X.save();X.globalAlpha=alpha;
 for(let i=-1;i<Math.ceil(W/tileW)+2;i++){
   const x=Math.floor(off+i*tileW);
   // alternate flip to hide the repeating seam
   X.save();
   if(i%2){X.translate(x+tileW,0);X.scale(-1,1);X.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,0,y,tileW,h);}
   else X.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,x,y,tileW,h);
   X.restore();
 }
 X.restore();
}

 bg();
 // bullets behind characters
 for(const b of bullets){X.fillStyle='#fff4a8';X.fillRect(b.x-cam,b.y,b.w,b.h);X.fillStyle='#ffb43d';X.fillRect(b.x-cam+2,b.y+2,b.w+6,3)}
 for(const e of enemies)drawSprite(e,1.72);drawSprite(player,1.9);
 for(const f of fx){const sx=f.x-cam;if(f.type==='hit'){X.strokeStyle='#fff';X.lineWidth=4;X.beginPath();X.moveTo(sx-12,f.y-12);X.lineTo(sx+12,f.y+12);X.moveTo(sx+12,f.y-12);X.lineTo(sx-12,f.y+12);X.stroke()}else{X.fillStyle='#ffd34e';X.beginPath();X.moveTo(sx,f.y);X.lineTo(sx-f.face*18,f.y-9);X.lineTo(sx-f.face*18,f.y+9);X.fill()}}
 bar(18,18,230,player.hp,player.maxHp,'#34d16a',NAMES[player.kind]);
 X.fillStyle='#fff';X.font='bold 15px system-ui';X.fillText('🪙 '+coins+'   ☠ '+kills,18,62);
 X.fillStyle='#f9cb3b';X.font='900 20px system-ui';X.textAlign='center';X.fillText('JANGRAI ONLINE • STAGE 1 • ด่านตรวจนครป่วน',W/2,32);X.textAlign='left';
 for(const e of enemies)if(!e.dead&&Math.abs(e.x-player.x)<350){bar(e.x-cam-20,e.y-22,90,e.hp,e.maxHp,'#ef4545','');}
 if(player.dead){X.fillStyle='#0009';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.textAlign='center';X.font='900 42px monospace';X.fillText('YOU DIED',W/2,230);X.font='18px system-ui';X.fillText('กด RESTART เพื่อเอาคืน',W/2,270);X.textAlign='left'}
 if(kills===enemies.length&&!player.dead){X.fillStyle='#0008';X.fillRect(0,0,W,H);X.fillStyle='#ffd43b';X.textAlign='center';X.font='900 38px system-ui';X.fillText('เคลียร์ด่านทดลองแล้ว!',W/2,230);X.fillStyle='#fff';X.font='18px system-ui';X.fillText('โมชั่นตัวละคร + ศัตรู ใช้ Sprite Sheet ที่ล็อกไว้',W/2,270);X.textAlign='left'}
}
function loop(now){let dt=Math.min(.034,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
ATLAS.onload=()=>{drawCards();resetWorld();requestAnimationFrame(loop)};

function drawCards(){
 document.querySelectorAll('.card').forEach(card=>{const cn=card.dataset.char,cv=card.querySelector('canvas'),ct=cv.getContext('2d');ct.imageSmoothingEnabled=false;const f=MAP[cn].idle[0];ct.clearRect(0,0,128,128);ct.drawImage(ATLAS,...f,12,8,104,104)})
}
document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{chosen=card.dataset.char;document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));card.classList.add('selected')}));
document.getElementById('start').onclick=()=>{started=true;resetWorld();document.getElementById('select').style.display='none'};
document.getElementById('restart').onclick=()=>{if(!started) return; resetWorld()};

addEventListener('keydown',e=>{key[e.code]=true;if(['ArrowUp','Space','KeyW'].includes(e.code)&&!e.repeat){key.jumpPulse=true;e.preventDefault()}if(e.code==='KeyJ'&&!e.repeat)key.shootPulse=true;if(e.code==='KeyK'&&!e.repeat)key.meleePulse=true;if(e.code==='KeyR')resetWorld()});
addEventListener('keyup',e=>key[e.code]=false);
function hold(id,n){const b=document.getElementById(id);const dn=e=>{e.preventDefault();touch[n]=true;b.classList.add('on')};const up=e=>{e.preventDefault();touch[n]=false;b.classList.remove('on')};b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,up))}
hold('left','left');hold('right','right');
['jump','shoot','melee'].forEach(n=>document.getElementById(n).addEventListener('pointerdown',e=>{e.preventDefault();touch[n]=true;setTimeout(()=>touch[n]=false,60)}));
})();
</script>
</body></html>
