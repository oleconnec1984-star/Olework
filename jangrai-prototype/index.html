<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>จังไรออนไลน์ — Stage 1</title>
<style>
html,body{margin:0;height:100%;background:#0e1118;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,960px);height:auto;max-height:100vh;background:#1b2130;image-rendering:pixelated}
#ui{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;align-items:end;padding:0 12px;pointer-events:none}
.grp{display:flex;gap:8px;pointer-events:auto}
button{width:62px;height:62px;border-radius:18px;border:2px solid rgba(255,255,255,.23);background:rgba(8,10,15,.72);color:#fff;font-size:24px;font-weight:800;touch-action:none}
button.on,button:active{background:rgba(255,255,255,.22);transform:scale(.95)}
.action{font-size:14px;line-height:1.1}
#restart{position:fixed;right:10px;top:10px;width:auto;height:38px;padding:0 12px;border-radius:12px;font-size:12px;z-index:10}
#status{position:fixed;left:10px;top:10px;font-size:11px;opacity:.75;pointer-events:none}
@media(min-width:900px){#ui{opacity:.55}}
</style>
</head>
<body>
<div class="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<button id="restart">RESTART</button>
<div id="status">Standalone Canvas • no external CDN</div>
<div id="ui">
  <div class="grp"><button id="left">◀</button><button id="right">▶</button><button id="jump">▲</button></div>
  <div class="grp"><button id="shoot" class="action">ยิง<br>J</button><button id="melee" class="action">ตี<br>K</button></div>
</div>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=c.width,H=c.height,groundY=486;
const key=Object.create(null),touch={left:false,right:false,jump:false,shoot:false,melee:false};
let last=performance.now(),shots=[],sparks=[],gameOver=false,win=false,p,e;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){
  p={x:120,y:groundY-64,w:44,h:64,vx:0,vy:0,hp:100,onGround:true,face:1,shootCd:0,meleeCd:0,flash:0};
  e={x:740,y:groundY-64,w:44,h:64,vx:-70,vy:0,hp:100,alive:true,flash:0,hitCd:0};
  shots=[];sparks=[];gameOver=false;win=false;
}
reset();
function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function attackMelee(){
  if(gameOver||p.meleeCd>0)return;p.meleeCd=.42;
  sparks.push({x:p.x+(p.face>0?p.w+22:-22),y:p.y+30,t:.14,type:'slash',face:p.face});
  if(e.alive){const dx=(e.x+e.w/2)-(p.x+p.w/2);if(Math.abs(dx)<82&&Math.abs(e.y-p.y)<60)damageEnemy(35,p.face*185)}
}
function shoot(){
  if(gameOver||p.shootCd>0)return;p.shootCd=.25;
  shots.push({x:p.x+p.w/2+p.face*24,y:p.y+29,vx:p.face*560,w:14,h:5,life:1.4});
  sparks.push({x:p.x+p.w/2+p.face*28,y:p.y+30,t:.07,type:'muzzle',face:p.face});
}
function damageEnemy(d,kb){
  if(!e.alive)return;e.hp=Math.max(0,e.hp-d);e.vx=kb;e.flash=.08;
  sparks.push({x:e.x+22,y:e.y+30,t:.15,type:'hit'});
  if(e.hp<=0){e.alive=false;win=true;gameOver=true}
}
function damagePlayer(){
  if(gameOver||e.hitCd>0)return;e.hitCd=.85;p.hp=Math.max(0,p.hp-15);p.flash=.09;
  const dir=(p.x<e.x?-1:1);p.vx=dir*260;p.vy=-250;
  if(p.hp<=0){gameOver=true;win=false}
}
function update(dt){
  p.shootCd=Math.max(0,p.shootCd-dt);p.meleeCd=Math.max(0,p.meleeCd-dt);p.flash=Math.max(0,p.flash-dt);
  e.hitCd=Math.max(0,e.hitCd-dt);e.flash=Math.max(0,e.flash-dt);
  if(!gameOver){
    const L=key.ArrowLeft||key.KeyA||touch.left,R=key.ArrowRight||key.KeyD||touch.right;
    if(L&&!R){p.vx=-235;p.face=-1}else if(R&&!L){p.vx=235;p.face=1}else p.vx*=.72;
    if((touch.jump||key.jumpPulse)&&p.onGround){p.vy=-515;p.onGround=false}touch.jump=false;key.jumpPulse=false;
    if(touch.shoot||key.shootPulse){shoot()}touch.shoot=false;key.shootPulse=false;
    if(touch.melee||key.meleePulse){attackMelee()}touch.melee=false;key.meleePulse=false;
    p.vy+=1100*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp(p.x,0,W-p.w);
    if(p.y+p.h>=groundY){p.y=groundY-p.h;p.vy=0;p.onGround=true}else p.onGround=false;
    if(e.alive){
      const dx=p.x-e.x;if(Math.abs(dx)<330)e.vx=Math.sign(dx||1)*82;
      e.x+=e.vx*dt;e.x=clamp(e.x,0,W-e.w);
      if(rects(p,e))damagePlayer();
    }
  }
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.life-=dt;if(e.alive&&rects(s,e)){shots.splice(i,1);damageEnemy(20,Math.sign(s.vx)*120);continue}if(s.life<=0||s.x<-30||s.x>W+30)shots.splice(i,1)}
  for(let i=sparks.length-1;i>=0;i--){sparks[i].t-=dt;if(sparks[i].t<=0)sparks.splice(i,1)}
}
function pxRect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function hero(o,colBody){
  const flash=o.flash>0;pxRect(o.x+10,o.y+2,24,17,flash?'#fff':'#f2c94c');pxRect(o.x+15,o.y+8,4,4,'#111');pxRect(o.x+27,o.y+8,4,4,'#111');
  pxRect(o.x+7,o.y+20,30,31,flash?'#fff':colBody);pxRect(o.x+10,o.y+51,10,13,'#111');pxRect(o.x+27,o.y+51,10,13,'#111');
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#1b2130';ctx.fillRect(0,0,W,H);ctx.fillStyle='#29313f';ctx.fillRect(0,400,W,140);ctx.fillStyle='#343b47';ctx.fillRect(700,210,150,190);ctx.fillStyle='#4f5969';ctx.fillRect(55,290,210,16);ctx.fillStyle='#4b5563';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.fillText('JANGRAI ONLINE — STAGE 1',24,32);ctx.font='16px monospace';ctx.fillStyle='#8dff9d';ctx.fillText('PLAYER HP  '+p.hp+'/100',24,64);ctx.fillStyle='#ff9696';ctx.fillText('ENEMY HP  '+e.hp+'/100',680,64);
  hero(p,'#2f80ed');if(e.alive)hero(e,'#6d2330');ctx.fillStyle='#fff';for(const s of shots)ctx.fillRect(s.x,s.y,s.w,s.h);
  for(const f of sparks){if(f.type==='muzzle'){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.face*16,f.y-8);ctx.lineTo(f.x-f.face*16,f.y+8);ctx.fill()}else if(f.type==='hit'){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(f.x-12,f.y-12);ctx.lineTo(f.x+12,f.y+12);ctx.moveTo(f.x+12,f.y-12);ctx.lineTo(f.x-12,f.y+12);ctx.stroke()}else{ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,22,f.face>0?-1.1:2.05,f.face>0?1.1:4.2);ctx.stroke()}}
  if(gameOver){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px monospace';ctx.fillText(win?'ENEMY DOWN!':'YOU DIED',W/2,235);ctx.font='20px monospace';ctx.fillText('RESTART',W/2,275);ctx.textAlign='left'}
}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.addEventListener('keydown',ev=>{key[ev.code]=true;if(['ArrowUp','Space','KeyW'].includes(ev.code)){if(!ev.repeat)key.jumpPulse=true;ev.preventDefault()}if(ev.code==='KeyJ'&&!ev.repeat)key.shootPulse=true;if(ev.code==='KeyK'&&!ev.repeat)key.meleePulse=true;if(ev.code==='KeyR')reset()});
window.addEventListener('keyup',ev=>{key[ev.code]=false});
function hold(id,name){const b=document.getElementById(id);const down=ev=>{ev.preventDefault();touch[name]=true;b.classList.add('on')};const up=ev=>{ev.preventDefault();touch[name]=false;b.classList.remove('on')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,up))}
hold('left','left');hold('right','right');
['jump','shoot','melee'].forEach(name=>document.getElementById(name).addEventListener('pointerdown',ev=>{ev.preventDefault();touch[name]=true}));
document.getElementById('restart').addEventListener('click',reset);
})();
</script>
</body>
</html>
