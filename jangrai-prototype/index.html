 create(){this.cameras.main.setBackgroundColor('#0b1020');this.drawStage();this.makeAnimations();this.makeFxAnimations();this.player=this.physics.add.sprite(240,430,'tum_atlas',0).setOrigin(.5,1).setScale(1.0);this.player.body.setSize(52,96).setOffset(54,58);this.player.setCollideWorldBounds(true);this.enemy=this.add.rectangle(790,430,68,112,0x26334e).setOrigin(.5,1).setStrokeStyle(3,0xf0f2ff,.5);this.physics.add.existing(this.enemy);this.enemy.body.setImmovable(true);this.enemy.hp=100;this.enemy.alive=true;this.enemyBaseX=790;this.cursors=this.input.keyboard.createCursorKeys();this.keys=this.input.keyboard.addKeys('Z,X,C,V,R,ONE,TWO,THREE,FOUR');this.input.keyboard.on('keydown-ONE',()=>this.switchChar('tum'));this.input.keyboard.on('keydown-TWO',()=>this.switchChar('pheekhor'));this.input.keyboard.on('keydown-THREE',()=>this.switchChar('em'));this.input.keyboard.on('keydown-FOUR',()=>this.switchChar('sorja'));this.input.keyboard.on('keydown-R',()=>this.resetEnemy());this.nameText=this.add.text(18,16,'',{fontFamily:'system-ui',fontSize:'22px',fontStyle:'bold',color:'#fff'}).setScrollFactor(0);this.helpText=this.add.text(18,46,'',{fontFamily:'system-ui',fontSize:'13px',color:'#cbd5ff'}).setScrollFactor(0);this.enemyHpBg=this.add.rectangle(760,32,260,16,0x11131b).setOrigin(.5).setStrokeStyle(2,0xffffff,.3);this.enemyHp=this.add.rectangle(630,32,260,12,0xf34747).setOrigin(0,.5);this.add.text(760,53,'ตำรวจสายประชิด — เป้าทดสอบ',{fontFamily:'system-ui',fontSize:'13px',color:'#fff'}).setOrigin(.5,0);this.switchChar('tum');}
 drawStage(){const g=this.add.graphics();g.fillGradientStyle(0x102650,0x102650,0x471b4a,0x471b4a,1);g.fillRect(0,0,960,370);g.fillStyle(0x0a0d18,1);for(let x=0;x<960;x+=54){const h=90+(x*19)%160;g.fillRect(x,300-h,42,h)}g.fillStyle(0x22283a,1);g.fillRect(0,370,960,170);g.fillStyle(0x3b4258,1);g.fillRect(0,416,960,5);g.fillStyle(0xf6c735,1);for(let x=30;x<940;x+=120)g.fillRect(x,480,64,5);g.fillStyle(0xc54145,1);g.fillRect(690,330,12,86);g.fillStyle(0xf4f4f4,1);g.fillRect(715,345,130,13);g.fillStyle(0xc54145,1);g.fillRect(715,358,130,18);this.add.text(730,338,'ด่านตรวจนครป่วน',{fontFamily:'system-ui',fontSize:'13px',color:'#111',fontStyle:'bold'});this.physics.world.setBounds(0,0,960,430)}
 makeAnimations(){for(const [id,cfg] of Object.entries(PLAYERS))for(const [act,base] of Object.entries(ACTIONS)){let n=base.n;if(act==='run')n=cfg.run;if(act==='jump')n=cfg.jump;if(act==='shoot')n=cfg.shoot;if(act==='melee')n=cfg.melee;const start=ROW[act]*8;this.anims.create({key:`${id}_${act}`,frames:this.anims.generateFrameNumbers(`${id}_atlas`,{start,end:start+n-1}),frameRate:base.fps,repeat:base.repeat})}}
 makeFxAnimations(){FX_ORDER.forEach((id,row)=>{const f=FX[id],start=row*6;this.anims.create({key:id,frames:this.anims.generateFrameNumbers('fx_atlas',{start,end:start+f.n-1}),frameRate:f.fps,repeat:0,hideOnComplete:true})})}
 switchChar(id){this.charId=id;this.attackLock=false;this.player.setTexture(`${id}_atlas`,ROW.idle*8);this.playAction('idle',true)}
 playAction(act,force=false){const key=`${this.charId}_${act}`;if(force||this.player.anims.currentAnim?.key!==key)this.player.play(key,true)}
 spawnFx(key,x,y,scale=1,flip=false){const f=FX[key],s=this.add.sprite(x,y,'fx_atlas').setOrigin(f.ox,f.oy).setScale(scale).setFlipX(flip);s.play(key);s.once('animationcomplete',()=>s.destroy());return s}
 justTouch(k){if(touch[k]&&!this.touchLatch[k]){this.touchLatch[k]=true;return true}if(!touch[k])this.touchLatch[k]=false;return false}
 update(time){const cfg=PLAYERS[this.charId],grounded=this.player.body.blocked.down||this.player.y>=430;if(this.player.y>430){this.player.y=430;this.player.setVelocityY(0)}if(!this.attackLock){let vx=0;if(this.cursors.left.isDown||touch.left)vx=-cfg.speed;if(this.cursors.right.isDown||touch.right)vx=cfg.speed;this.player.setVelocityX(vx);if(vx){this.player.setFlipX(vx<0);if(grounded)this.playAction('run');if(grounded&&time-this.lastDust>145){this.spawnFx('fx_run_dust',this.player.x-(vx<0?-1:1)*10,432,.72,vx<0);this.lastDust=time}}else{this.player.setVelocityX(0);if(grounded)this.playAction('idle')}if((Phaser.Input.Keyboard.JustDown(this.cursors.space)||this.justTouch('jump'))&&grounded){this.player.setVelocityY(-520);this.playAction('jump',true)}if(!grounded)this.playAction(this.player.body.velocity.y<20?'jump':'fall');if(Phaser.Input.Keyboard.JustDown(this.keys.Z)||this.justTouch('shoot'))this.shoot();if(Phaser.Input.Keyboard.JustDown(this.keys.X)||this.justTouch('melee'))this.melee();if(Phaser.Input.Keyboard.JustDown(this.keys.C)||this.justTouch('skill'))this.skill();if(Phaser.Input.Keyboard.JustDown(this.keys.V)||this.justTouch('ultimate'))this.ultimate()}if(!this.wasGrounded&&grounded)this.spawnFx('fx_landing_dust',this.player.x,432,.85,this.player.flipX);this.wasGrounded=grounded;this.projectiles=this.projectiles.filter(p=>{if(!p.active)return false;if(this.enemy.alive&&Phaser.Geom.Intersects.RectangleToRectangle(p.getBounds(),this.enemy.getBounds())){this.damageEnemy(12,p.x,p.y,'small');p.destroy();return false}if(p.x<-20||p.x>980){p.destroy();return false}return true});this.nameText.setText(`${cfg.name}  |  Enemy ${Math.max(0,this.enemy.hp)}%`);this.helpText.setText(`Action: ${this.player.anims.currentAnim?.key?.replace(this.charId+'_','')||'-'} • 1-4 เปลี่ยนตัว • Z/X/C/V โจมตี`);this.enemyHp.width=260*Math.max(0,this.enemy.hp)/100}
 shoot(){if(this.attackLock)return;this.attackLock=true;this.player.setVelocityX(0);this.playAction('shoot',true);const cfg=PLAYERS[this.charId],dir=this.player.flipX?-1:1;this.time.delayedCall(115,()=>{this.spawnFx(cfg.shootFx,this.player.x+dir*48,this.player.y-70,this.charId==='tum'?.8:.82,dir<0);const p=this.add.rectangle(this.player.x+dir*58,this.player.y-68,this.charId==='sorja'?18:12,this.charId==='sorja'?12:8,cfg.projectile).setOrigin(.5);this.physics.add.existing(p);p.body.setVelocityX(dir*(this.charId==='tum'?520:430));p.body.setAllowGravity(false);this.projectiles.push(p)});this.time.delayedCall(380,()=>this.attackLock=false)}
 melee(){if(this.attackLock)return;this.attackLock=true;this.player.setVelocityX(0);this.playAction('melee',true);const cfg=PLAYERS[this.charId],dir=this.player.flipX?-1:1;this.time.delayedCall(145,()=>{const hx=this.player.x+dir*58,hy=this.player.y-66;this.spawnFx(cfg.meleeFx,hx,hy,cfg.meleeFx==='fx_hit_heavy'?.9:1,dir<0);if(this.enemy.alive&&Math.abs(this.enemy.x-hx)<105)this.damageEnemy(this.charId==='em'?26:20,hx,hy,'heavy')});this.time.delayedCall(430,()=>this.attackLock=false)}
 skill(){if(this.attackLock)return;this.attackLock=true;const dir=this.player.flipX?-1:1;if(this.charId==='tum'){this.spawnFx('fx_run_dust',this.player.x,432,1.05,dir<0);this.tweens.add({targets:this.player,x:this.player.x+dir*170,duration:220,ease:'Quad.easeOut'});this.time.delayedCall(120,()=>this.spawnFx('fx_hit_heavy',this.player.x+dir*45,this.player.y-62,1,dir<0))}else if(this.charId==='em'){this.spawnFx('fx_em_chain_arc',this.player.x+dir*75,this.player.y-68,1.15,dir<0);if(this.enemy.alive&&Math.abs(this.enemy.x-this.player.x)<190)this.damageEnemy(34,this.enemy.x,this.enemy.y-70,'heavy')}else if(this.charId==='sorja'){for(let i=0;i<3;i++)this.time.delayedCall(i*100,()=>this.spawnFx('fx_sorja_heart',this.player.x+dir*(65+i*35),this.player.y-80-i*8,.8,dir<0));if(this.enemy.alive&&Math.abs(this.enemy.x-this.player.x)<260)this.damageEnemy(28,this.enemy.x,this.enemy.y-70,'small')}else{this.spawnFx('fx_pheekhor_bowl_impact',this.player.x+dir*70,this.player.y-62,1.1,dir<0);if(this.enemy.alive&&Math.abs(this.enemy.x-this.player.x)<150)this.damageEnemy(30,this.enemy.x,this.enemy.y-70,'heavy')}this.time.delayedCall(480,()=>this.attackLock=false)}
 ultimate(){if(this.attackLock)return;this.attackLock=true;const dir=this.player.flipX?-1:1;this.cameras.main.shake(520,.012);for(let i=0;i<3;i++)this.time.delayedCall(120+i*130,()=>{const x=this.player.x+dir*(110+i*80);this.spawnFx('fx_explosion',x,430,1.25,dir<0);this.spawnFx('fx_smoke',x,430,1.05,dir<0)});this.time.delayedCall(260,()=>{if(this.enemy.alive)this.damageEnemy(60,this.enemy.x,this.enemy.y-70,'heavy')});this.time.delayedCall(800,()=>this.attackLock=false)}
 damageEnemy(amount,x,y,kind){if(!this.enemy.alive)return;this.enemy.hp-=amount;this.spawnFx(kind==='heavy'?'fx_hit_heavy':'fx_hit_small',x,y,kind==='heavy'?1:.8,false);this.cameras.main.shake(kind==='heavy'?90:55,kind==='heavy'?.008:.004);this.enemy.setFillStyle(0xffffff);this.time.delayedCall(45,()=>this.enemy.setFillStyle(0x26334e));const dir=this.enemy.x<this.player.x?-1:1;this.tweens.add({targets:this.enemy,x:this.enemy.x+dir*(kind==='heavy'?20:9),duration:90,yoyo:true});if(this.enemy.hp<=0){this.enemy.hp=0;this.enemy.alive=false;this.spawnFx('fx_explosion',this.enemy.x,430,1.25,false);this.spawnFx('fx_smoke',this.enemy.x,430,1.2,false);this.enemy.setVisible(false);this.time.delayedCall(1000,()=>this.resetEnemy())}}
 resetEnemy(){this.enemy.hp=100;this.enemy.alive=true;this.enemy.x=this.enemyBaseX;this.enemy.setVisible(true).setFillStyle(0x26334e)}
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:960,height:540,pixelArt:true,antialias:false,roundPixels:true,physics:{default:'arcade',arcade:{gravity:{y:1250},debug:false}},scene:[GameScene],scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
})();

</script>
