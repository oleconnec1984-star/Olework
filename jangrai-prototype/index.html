function draw(){x.clearRect(0,0,W,H);bg();if(started){for(const e of enemies)drawEnemy(e);for(const b of bullets)rect(b.x-cam,b.y,b.w,b.h,'#ffd84d');drawHero();effects();hud();if(gameOver){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle=win?'#ffd54a':'#fff';x.font='1000 52px system-ui';x.fillText(win?'STAGE CLEAR!':'YOU DIED',W/2,300);x.font='bold 23px system-ui';x.fillStyle='#fff';x.fillText('กด RESTART เพื่อลุยใหม่',W/2,345);x.textAlign='left'}}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{if(e.code==='KeyA'||e.code==='ArrowLeft')input.left=true;if(e.code==='KeyD'||e.code==='ArrowRight')input.right=true;if(['KeyW','ArrowUp','Space'].includes(e.code)&&!e.repeat)input.jump=true;if(e.code==='KeyJ'&&!e.repeat)input.shoot=true;if(e.code==='KeyK'&&!e.repeat)input.melee=true});window.addEventListener('keyup',e=>{if(e.code==='KeyA'||e.code==='ArrowLeft')input.left=false;if(e.code==='KeyD'||e.code==='ArrowRight')input.right=false});
function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true;b.classList.add('on')});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();if(key==='left'||key==='right')input[key]=false;b.classList.remove('on')}))}hold('left','left');hold('right','right');hold('jump','jump');hold('shoot','shoot');hold('melee','melee');
</script></body></html>
